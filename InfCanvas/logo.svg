<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="InfCanvas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="18" y="20" width="32" height="26" rx="5"/>
    </clipPath>
  </defs>

  <!-- 底 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 背景网格点（无限画布暗示） -->
  <g fill="rgba(255,255,255,.10)">
    <circle cx="12" cy="12" r="1"/><circle cx="26" cy="10" r="1"/>
    <circle cx="40" cy="12" r="1"/><circle cx="54" cy="10" r="1"/>
    <circle cx="10" cy="26" r="1"/><circle cx="54" cy="26" r="1"/>
    <circle cx="12" cy="42" r="1"/><circle cx="40" cy="54" r="1"/>
    <circle cx="26" cy="56" r="1"/><circle cx="54" cy="42" r="1"/>
  </g>

  <!-- 后置画布面板（深度） -->
  <g transform="rotate(-8 40 26)">
    <rect x="26" y="12" width="30" height="26" rx="5" fill="rgba(255,255,255,.22)"/>
  </g>

  <!-- 前置画布面板 -->
  <rect x="18" y="20" width="32" height="26" rx="5" fill="#ffffff"/>

  <!-- 面板内图像：山峦 + 日 -->
  <g clip-path="url(#clip)">
    <circle cx="24" cy="27" r="3.4" fill="#2563eb"/>
    <path d="M16 42 25 31 31 39 37 33 50 46 50 47 16 47Z" fill="#93c5fd"/>
    <path d="M25 31 31 39 28 42 22 36Z" fill="#2563eb" opacity=".25"/>
  </g>

  <!-- 添加标记（节点/新建画布） -->
  <g transform="translate(44 42)">
    <circle cx="5" cy="5" r="7" fill="#ffffff" stroke="#1e40af" stroke-width="1.4"/>
    <path d="M5 2v6M2 5h6" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
